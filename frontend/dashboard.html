<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dashboard — SplitSync</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .welcome-banner {
      background: linear-gradient(135deg, rgba(108,99,255,0.15) 0%, rgba(108,99,255,0.05) 100%);
      border: 1px solid rgba(108,99,255,0.2);
      border-radius: var(--radius-lg);
      padding: 28px 32px;
      margin-bottom: 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .welcome-title {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 4px;
    }

    .welcome-title span { color: var(--accent); }

    .welcome-sub {
      font-size: 14px;
      color: var(--text-secondary);
    }

    .welcome-icon {
      font-size: 48px;
      opacity: 0.6;
    }

    .section-title {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 16px;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-size: 12px;
    }

    .recent-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .recent-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      transition: all 0.2s ease;
      cursor: pointer;
      text-decoration: none;
      color: inherit;
    }

    .recent-item:hover {
      border-color: rgba(108,99,255,0.2);
      background: var(--bg-hover);
    }

    .recent-item-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .recent-avatar {
      width: 36px;
      height: 36px;
      background: var(--accent-soft);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 13px;
      color: var(--accent);
      flex-shrink: 0;
    }

    .recent-name {
      font-size: 14px;
      font-weight: 500;
    }

    .recent-group {
      font-size: 12px;
      color: var(--text-secondary);
    }

    .two-col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      margin-top: 32px;
    }

    @media (max-width: 768px) {
      .two-col { grid-template-columns: 1fr; }
      .welcome-icon { display: none; }
    }
  </style>
</head>
<body>

<div class="layout">

  <!-- ── Sidebar ── -->
  <aside class="sidebar">
    <div class="sidebar-logo">Split<span>Sync</span></div>
    <nav class="sidebar-nav">
      <a href="dashboard.html" class="nav-item active">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
        Dashboard
      </a>
      <a href="grupos.html" class="nav-item">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
        Grupos
      </a>
      <a href="pagamentos.html" class="nav-item">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>
        Pagamentos
      </a>
    </nav>
    <div class="sidebar-footer">
      <button class="nav-item" onclick="logout()">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
        Sair
      </button>
    </div>
  </aside>

  <!-- ── Main Content ── -->
  <main class="main-content">

    <!-- Welcome Banner -->
    <div class="welcome-banner">
      <div>
        <div class="welcome-title">Bem-vindo, <span>Administrador</span> 👋</div>
        <div class="welcome-sub">Aqui está o resumo do sistema hoje.</div>
      </div>
      <div class="welcome-icon">📊</div>
    </div>

    <!-- Stats -->
    <div class="stats-grid" id="stats-grid">
      <div class="stat-card">
        <div class="stat-label">Total de Grupos</div>
        <div class="stat-value accent" id="stat-groups">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Total de Membros</div>
        <div class="stat-value" id="stat-members">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Pagamentos Pendentes</div>
        <div class="stat-value warning" id="stat-pending">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Pagamentos Confirmados</div>
        <div class="stat-value success" id="stat-confirmed">—</div>
      </div>
    </div>

    <!-- Two column section -->
    <div class="two-col">

      <!-- Recent Groups -->
      <div>
        <div class="section-title">Grupos Recentes</div>
        <div class="recent-list" id="recent-groups">
          <div class="loading"><div class="spinner"></div> Carregando...</div>
        </div>
      </div>

      <!-- Recent Payments -->
      <div>
        <div class="section-title">Últimos Pagamentos</div>
        <div class="recent-list" id="recent-payments">
          <div class="loading"><div class="spinner"></div> Carregando...</div>
        </div>
      </div>

    </div>

  </main>
</div>

<!-- Toast Container -->
<div class="toast-container" id="toast-container"></div>

<script src="js/auth.js"></script>
<script>
  // Protect this page — redirect to login if not authenticated
  requireAuth();

  // Load all dashboard data when page loads
  document.addEventListener('DOMContentLoaded', loadDashboard);

  async function loadDashboard() {
    await Promise.all([
      loadGroups(),
      loadPayments(),
      loadMembersCount(),
    ]);
  }

  // Fetch total member count across all groups
  async function loadMembersCount() {
    try {
      // Get all groups first, then count members in each
      const groupsRes = await fetch(`${API_URL}/groups`, { headers: authHeaders() });
      const groups = await groupsRes.json();

      if (!groups.length) {
        document.getElementById('stat-members').textContent = '0';
        return;
      }

      // Fetch member lists for all groups in parallel
      const memberLists = await Promise.all(
        groups.map(g =>
          fetch(`${API_URL}/members/group/${g.id}`, { headers: authHeaders() })
            .then(r => r.json())
            .catch(() => [])
        )
      );

      const total = memberLists.reduce((sum, list) => sum + list.length, 0);
      document.getElementById('stat-members').textContent = total;
    } catch {
      document.getElementById('stat-members').textContent = '—';
    }
  }

  // Fetch groups and update stats + recent list
  async function loadGroups() {
    try {
      const res = await fetch(`${API_URL}/groups`, {
        headers: authHeaders(),
      });
      const groups = await res.json();

      // Update stat
      document.getElementById('stat-groups').textContent = groups.length;

      // Render recent groups list (last 5)
      const container = document.getElementById('recent-groups');
      const recent = groups.slice(0, 5);

      if (recent.length === 0) {
        container.innerHTML = `<div class="empty-state"><p>Nenhum grupo criado ainda.</p></div>`;
        return;
      }

      container.innerHTML = recent.map(group => `
        <a class="recent-item" href="grupos.html" title="Ver grupo ${group.name}">
          <div class="recent-item-left">
            <div class="recent-avatar">${group.name.charAt(0).toUpperCase()}</div>
            <div>
              <div class="recent-name">${group.name}</div>
              <div class="recent-group">Tipo ${group.type} • ${formatCurrency(group.total_value)}</div>
            </div>
          </div>
          <span class="badge badge-type${group.type}">Tipo ${group.type}</span>
        </a>
      `).join('');

    } catch (err) {
      document.getElementById('recent-groups').innerHTML =
        `<div class="empty-state"><p>Erro ao carregar grupos.</p></div>`;
    }
  }

  // Fetch payments and update stats + recent list
  async function loadPayments() {
    try {
      const res = await fetch(`${API_URL}/payments`, {
        headers: authHeaders(),
      });
      const payments = await res.json();

      // Count by status
      const pending   = payments.filter(p => p.status === 'pending').length;
      const confirmed = payments.filter(p => p.status === 'confirmed').length;

      document.getElementById('stat-pending').textContent   = pending;
      document.getElementById('stat-confirmed').textContent = confirmed;

      // Render recent payments (last 5)
      const container = document.getElementById('recent-payments');
      const recent = payments.slice(0, 5);

      if (recent.length === 0) {
        container.innerHTML = `<div class="empty-state"><p>Nenhum pagamento ainda.</p></div>`;
        return;
      }

      const statusLabel = { pending: 'Pendente', confirmed: 'Confirmado', rejected: 'Rejeitado' };

      container.innerHTML = recent.map(p => `
        <div class="recent-item">
          <div class="recent-item-left">
            <div class="recent-avatar">${p.members?.name?.charAt(0).toUpperCase() || '?'}</div>
            <div>
              <div class="recent-name">${p.members?.name || 'Desconhecido'}</div>
              <div class="recent-group">${p.members?.groups?.name || ''} • ${formatCurrency(p.members?.individual_value || 0)}</div>
            </div>
          </div>
          <span class="badge badge-${p.status}">${statusLabel[p.status]}</span>
        </div>
      `).join('');

    } catch (err) {
      document.getElementById('recent-payments').innerHTML =
        `<div class="empty-state"><p>Erro ao carregar pagamentos.</p></div>`;
    }
  }
</script>

</body>
</html>
